# What the documentation site is allowed to publish.
#
# Without a summary, GitBook infers its navigation from the folders and Markdown files it
# finds. The site is meant to be a reading copy of the article and the few documents
# around it: the pages listed in docs/SUMMARY.md, and nothing else.
#
# The root stays at ./ (not ./docs/) because the pages embed figures from ../../assets/,
# and a root of ./docs/ would leave those paths outside what GitBook can read.
#
# Note the limit honestly: this is a publication filter, not a privacy control. The
# repository is public, so everything here is readable on GitHub either way.

root: ./

structure:
  readme: docs/README.md
  summary: docs/SUMMARY.md
